name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly (Mon 06:00 UTC). Unlike clippy, `cargo audit` can start failing
    # without any code change — a newly published advisory against a dependency
    # we already ship. The scheduled run catches that; PR/push runs catch the
    # rest.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Prebuilt binary — no compile step, keeps CI fast (a `cargo install
      # cargo-audit` would rebuild it every run).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/mdbg

      # Same commands a developer runs locally (npm run test:rust / lint:rust) —
      # nothing CI-only, so a failure here is always reproducible on a laptop.
      - name: Test
        run: npm run test:rust

      - name: Clippy
        run: npm run lint:rust

      - name: Audit
        run: npm run audit:rust
