name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly (Mon 06:00 UTC), for the Rust job's `cargo audit` only. Unlike clippy, it can start
    # failing without any code change -- a newly published advisory against a dependency we
    # already ship. PR/push runs catch everything else, so the TS job skips scheduled runs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Every step in both jobs is an npm script a developer can run locally -- nothing CI-only, so a
# failure here is always reproducible on a laptop. The jobs run in parallel so the slower Rust
# job never holds up TS results.
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Prebuilt binary — no compile step, keeps CI fast (a `cargo install
      # cargo-audit` would rebuild it every run).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/mdbg

      - name: Test
        run: npm run test:rust

      - name: Clippy
        run: npm run lint:rust

      - name: Audit
        run: npm run audit:rust

  ts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Compiles shared, checks its export boundary, then type-checks both extensions against it.
      - name: Shared Package Boundary + Type Check
        run: npm run check:shared-package

      - name: Unit Tests
        run: npm test

      - name: Formatting
        run: npm run fmt:ts:check
