name: bug report
description: Report a bug in MCU-Debug
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: debug-console-logs
    attributes:
      label: Debug Console Logs
      description: Paste logs from the VS Code Debug Console (enable gdbTraces first).
      render: shell
    validations:
      required: true

  - type: textarea
    id: launch-json
    attributes:
      label: launch.json
      description: Paste relevant launch.json content (remove sensitive values).
      render: json
    validations:
      required: true
