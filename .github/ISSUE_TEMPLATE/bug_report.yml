name: bug report
description: Report a bug in MCU-Debug
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### Before submitting
        - If your issue is for **Peripherals / SVD Viewer**, file it at https://github.com/mcu-debug/peripheral-viewer/issues/new/choose
        - If your issue is for **Memory Viewer**, file it at https://github.com/mcu-debug/memview/issues/new/choose
        - If your issue is for **RTOS Viewer**, file it at https://github.com/mcu-debug/rtos-views/issues/new/choose
        - For MCU-Debug issues, include Debug Console logs with **`"debugFlags": { "gdbTraces": true }`** enabled

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: debug-console-logs
    attributes:
      label: Debug Console Logs
      description: Paste logs from the VS Code Debug Console. Enable **`"debugFlags": { "gdbTraces": true }`** first; reports without logs are usually not actionable.
      render: shell
    validations:
      required: true

  - type: textarea
    id: launch-json
    attributes:
      label: launch.json
      description: Paste relevant launch.json content (remove sensitive values).
      render: json
    validations:
      required: true
