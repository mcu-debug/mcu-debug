[package]
name = "mdbg"
version = "0.1.16"
edition = "2021"

[dependencies]
# For ELF/Binary parsing
object = { version = "0.36", features = ["read", "compression"] }
# The DWARF powerhouse
gimli = "0.31"
# For ultra-fast address range lookups
addr2line = "0.24"
# For JSON communication with your TS extension
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# For fast path/file handling
anyhow = "1.0"
urlencoding = "2.1.3"
dunce = "1.0.5"
memmap2 = "0.9.9"
rustc-demangle = "0.1.27"
cpp_demangle = "0.5.1"
regex = "1"
ts-rs = "12.0.1"
clap = { version = "4.5.57", features = ["derive", "env"] }
capstone = "0.14.0"
tokio = { version = "1.49.0", features = ["full"] }
tempfile = "3.26.0"
log = "0.4"
flexi_logger = "0.29"
serialport = { version = "4.9.0", default-features = false }
notify = "8.2.0"
ratatui = "0.29"
tui-textarea = { version = "0.7", features = ["crossterm"] }
crossterm = "0.28"
libc = "0.2"
fd-lock = "4.0.4"
dirs = "6.0.0"
# Human-readable timestamps in `proxy --status`. Costs no extra build: flexi_logger
# already pulls chrono in, so this only makes an existing dependency direct.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Content fingerprint of the proxy's own executable (singleton::file_fingerprint). Already compiled
# in through `object`, so this only makes an existing dependency direct.
crc32fast = "1.5"
getrandom = "0.2"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1

# The executable fingerprint hashes the proxy's own binary at every start. Unoptimized, crc32fast takes
# ~49 ms on the 22 MB dev binary; optimized, ~6.5 ms. Only this one small crate is affected, so dev
# builds stay quick to compile.
[profile.dev.package.crc32fast]
opt-level = 3
